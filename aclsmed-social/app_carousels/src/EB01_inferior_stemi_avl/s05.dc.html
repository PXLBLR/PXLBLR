      </div>
      <div style="display: flex; gap: 14px; align-items: baseline; width: 100%"><span style="font-family: 'Geist Mono', monospace; font-size: 24px; color: #4C9DFF">1</span><span style="font-size: 28px; font-weight: 600; line-height: 1.3">Pick the rhythm from real specimens</span></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
      <div style="width: 330px; height: 715px; box-sizing: border-box; padding: 10px; border-radius: 52px; background: #151922; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 0 1px rgba(76,157,255,0.3), 0 40px 90px -30px rgba(76,157,255,0.55)">

      </div>
      <div style="display: flex; gap: 14px; align-items: baseline; width: 100%"><span style="font-family: 'Geist Mono', monospace; font-size: 24px; color: #4C9DFF">2</span><span style="font-size: 28px; font-weight: 600; line-height: 1.3">Ischaemia → Inferior → drag the ST shift</span></div>
    </div>
  </div>

  <div style="border-radius: 22px; padding: 22px 28px; background: rgba(21,25,34,0.9); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12); display: flex; gap: 14px; align-items: baseline"><span style="font-family: 'Geist Mono', monospace; font-size: 24px; color: #4C9DFF">3</span><span style="font-size: 28px; font-weight: 600; line-height: 1.3">The mirror in aVL appears on its own. Export a PNG or print-scale PDF for slides, handouts and exams.</span></div>
